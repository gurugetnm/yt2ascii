[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt2ascii"
version = "0.1.0"
description = "Turn YouTube videos into coloured ASCII art directly in your terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Thevindu Guruge" }]
keywords = ["youtube", "ascii", "terminal", "video", "cli", "ansi"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: Terminals",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "yt-dlp>=2024.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
yt2ascii = "yt2ascii.cli:main"

[project.urls]
Homepage = "https://github.com/thevinduguruge/yt2ascii"
Repository = "https://github.com/thevinduguruge/yt2ascii"

[tool.hatch.build.targets.wheel]
packages = ["src/yt2ascii"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
# Analyse with 3.12 semantics (bundled numpy stubs use PEP 695 syntax); the
# package itself still targets 3.11 at runtime.
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["cv2.*", "yt_dlp.*"]
ignore_missing_imports = true
